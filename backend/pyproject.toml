[project]
name = "signal-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2026.1",
  "fastembed>=0.5",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
