# Целевой вариант. Docker недоступен в среде агента: compose не проверен запуском.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://signal:${POSTGRES_PASSWORD}@postgres:5432/signal
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      STORAGE_DIRECTORY: /workspace/backend/storage
      SLA_INTERVAL_SECONDS: 60
    volumes:
      - attachments:/workspace/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  attachments:
